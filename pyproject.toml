[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "specinsure"
version = "0.2.0"
description = "Monte Carlo pricing, reinsurance, capital and portfolio optimisation for specialty (re)insurance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Goabaone Sehurutshe" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.25", "scipy>=1.10"]
keywords = ["actuarial", "reinsurance", "monte carlo", "insurance", "risk", "pricing", "capital", "london market"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "matplotlib>=3.7"]
examples = ["jupyter", "matplotlib", "pandas", "seaborn"]

[project.urls]
Homepage = "https://github.com/GSehurut/specinsure"
Issues = "https://github.com/GSehurut/specinsure/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/specinsure"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
