name: Bug report
description: Something is calculated wrongly or does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal example
      description: The smallest code (with synthetic data) that reproduces the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show` for this package, and your Python version
